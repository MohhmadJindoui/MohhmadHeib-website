<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Contact - Personal Website</title>

  <style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #141e30, #243b55);
        direction: rtl;
    }

    .page {
        width: 100%;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .card {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        padding: 24px 32px;
        border-radius: 24px;
        max-width: 900px;
        width: 100%;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    nav {
        display: flex;
        gap: 8px;
        margin-bottom: 25px;
    }

    nav a {
        padding: 6px 16px;
        border-radius: 999px;
        background: #f5f6ff;
        border: 1px solid #ccd4ff;
        text-decoration: none;
        color: #1b2559;
        transition: 0.15s ease;
    }

    nav a:hover {
        background: #3b82f6;
        color: white;
    }

    nav a.active {
        background: #1d4ed8;
        color: white;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.7);
    }

    h1 {
        margin-top: 0;
        margin-bottom: 20px;
        color: #111827;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 10px;
    }

    label {
        font-weight: 600;
        color: #1f2937;
    }

    input, textarea {
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
        font-family: inherit;
    }

    textarea {
        height: 120px;
        resize: none;
    }

    button {
        margin-top: 10px;
        padding: 12px;
        font-size: 1.1rem;
        border: none;
        border-radius: 14px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
    }

  </style>
</head>

<body>
<div class="page">
  <div class="card">

    <nav>
      <a href="index.html">Home</a>
      <a href="CVMohamed.html">CV</a>
      <a href="Contact.html" class="active">Contact</a>
    </nav>

    <h1>Contact</h1>

    <form action="Success.html" method="get">
      <label>שם מלא:</label>
      <input type="text" name="fullname" required>

      <label>אימייל:</label>
      <input type="email" name="email" required>

      <label>מספר טלפון:</label>
      <input type="tel" name="phone" required>

      <label>הודעה:</label>
      <textarea name="message" required></textarea>

      <button type="submit">שלח טופס</button>
    </form>

  </div>
</div>
</body>

</html>
